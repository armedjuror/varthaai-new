# nginx vhost for varthaai.com — HTTP only (add TLS later with certbot).
# Install:
#   sudo cp deploy/varthaai.nginx.conf /etc/nginx/sites-available/varthaai
#   sudo ln -s /etc/nginx/sites-available/varthaai /etc/nginx/sites-enabled/varthaai
#   sudo nginx -t && sudo systemctl reload nginx
#
# Later, TLS in one shot:  sudo certbot --nginx -d varthaai.com -d www.varthaai.com
# (certbot rewrites this file to add the 443 server block + http->https redirect.)

upstream varthaai_app {
    server 127.0.0.1:8007;
}

upstream varthaai_mcp {
    server 127.0.0.1:8801;
}

server {
    listen 80;
    listen [::]:80;
    server_name varthaai.com www.varthaai.com;

    # Uploaded flavor images, receipts, QR codes, etc.
    client_max_body_size 20M;

    access_log /var/log/nginx/varthaai.access.log;
    error_log  /var/log/nginx/varthaai.error.log;

    # nginx serves static/media directly — Django does NOT serve them when DEBUG=False.
    location /static/ {
        alias /home/ubuntu/varthaai-new/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /home/ubuntu/varthaai-new/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Business Analysis MCP server (bizmcp app, see deploy/MCP_ANALYTICS.md).
    # Bearer-token auth is enforced by the app itself (bizmcp/auth.py); nginx
    # just needs to pass the Authorization header through (its default
    # behaviour) and keep the streamable-http connection open/unbuffered.
    # NOTE: the location has no trailing slash so it matches both /mcp and
    # /mcp/... (a trailing-slash location only matches /mcp/...onward, not
    # the bare /mcp FastMCP's client actually requests). proxy_pass also has
    # NO trailing slash / URI part — FastMCP mounts its app at exactly /mcp
    # (verified: a Starlette Mount at that literal path, nothing at /), so
    # nginx must forward the original /mcp... path unchanged rather than
    # rewriting it to /. Both of these bit us in production once already.
    location /mcp {
        proxy_pass http://varthaai_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering off;
        proxy_connect_timeout 60s;
        proxy_read_timeout    3600s;
    }

    location / {
        proxy_pass http://varthaai_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 60s;
        proxy_read_timeout    60s;
    }
}

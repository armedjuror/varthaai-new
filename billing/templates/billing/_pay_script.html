{# Pay button for the order page and the pay page. Needs #payBtn and #payMsg. #}
{# Opens the active gateway's popup on our own page; the server confirms the payment. #}
{% if gateway == 'cashfree' %}
<script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
{% else %}
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
{% endif %}
<script>
(function () {
  var base = '/o/{{ link.token|escapejs }}/';
  var btn = document.getElementById('payBtn');
  var msg = document.getElementById('payMsg');
  function csrf() {
    var m = document.cookie.match(/(?:^|;\s*)csrftoken=([^;]+)/);
    return m ? decodeURIComponent(m[1]) : '';
  }
  function post(url, data) {
    return fetch(url, {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrf() },
      body: JSON.stringify(data || {})
    }).then(function (r) { return r.json(); });
  }
  function say(text, ok) { msg.textContent = text; msg.style.color = ok ? '#16a34a' : '#dc2626'; }

  // B2B pay page: optionally pay part of the balance.
  var partBox = document.getElementById('partBox');
  var part = document.getElementById('payPart');
  var inr = new Intl.NumberFormat('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  function partMode() { return partBox && !partBox.classList.contains('hidden'); }
  function chosenAmount() {
    if (!partMode()) return null;
    var v = parseFloat(part.value);
    return isNaN(v) ? NaN : Math.round(v * 100) / 100;
  }
  function refreshLabel() {
    var a = partMode() ? chosenAmount() : parseFloat(btn.dataset.full);
    btn.textContent = (a > 0) ? 'Pay ₹' + inr.format(a) : 'Pay';
  }
  if (partBox) {
    document.getElementById('partToggle').addEventListener('click', function () {
      partBox.classList.toggle('hidden');
      this.textContent = partMode() ? 'Pay the full amount instead' : 'Pay part of this amount';
      if (!partMode()) part.value = btn.dataset.full;
      else part.focus();
      refreshLabel(); say('', true);
    });
    part.addEventListener('input', refreshLabel);
  }
  function confirmPaid(data, quietIfUnpaid) {
    say('Confirming payment…', true);
    return post(base + 'pay/verify/', data).then(function (v) {
      if (v.success) { say(v.message, true); setTimeout(function () { window.location.reload(); }, 1200); return; }
      btn.disabled = false;
      say(quietIfUnpaid ? '' : v.message, false);
    }).catch(function () { btn.disabled = false; say('Could not confirm yet — refresh in a minute.', false); });
  }
  function payCashfree(res) {
    if (typeof Cashfree === 'undefined') { say('Could not load the payment window. Please try again.', false); btn.disabled = false; return; }
    say('', true);
    Cashfree({ mode: res.mode }).checkout({ paymentSessionId: res.payment_session_id, redirectTarget: '_modal' })
      .then(function (result) {
        if (result.redirect) return;  // in-app browser: Cashfree brings the customer back to this page
        // Closed popup or finished attempt: ask our server for the real status.
        confirmPaid({ cashfree_order_id: res.cashfree_order_id }, !result.paymentDetails);
      });
  }
  function payRazorpay(res) {
    var rzp = new Razorpay({
      key: res.key_id, amount: res.amount, currency: res.currency, name: res.name,
      description: res.description, order_id: res.razorpay_order_id,
      theme: { color: '#85aa4e' },
      handler: function (r) { confirmPaid(r, false); },
      modal: { ondismiss: function () { btn.disabled = false; say('', true); } }
    });
    rzp.open();
  }
  btn.addEventListener('click', function () {
    var amount = chosenAmount();
    if (amount !== null) {
      var min = parseFloat(part.min), max = parseFloat(part.max);
      if (!(amount >= min && amount <= max)) {
        say('Enter an amount between ₹' + inr.format(min) + ' and ₹' + inr.format(max) + '.', false); return;
      }
    }
    btn.disabled = true; say('Opening payment…', true);
    post(base + 'pay/', amount !== null ? { amount: amount } : {}).then(function (res) {
      if (!res.success) { say(res.message, false); btn.disabled = false; return; }
      if (res.gateway === 'cashfree') payCashfree(res); else payRazorpay(res);
    }).catch(function () { say('Something went wrong. Please try again.', false); btn.disabled = false; });
  });
})();
</script>

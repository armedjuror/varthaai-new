{% extends 'formbuilder/_base_public.html' %}
{% block title %}{{ form.success_title }}{% endblock %}
{% block body %}
<div class="center">
  <h1>{{ form.success_title }}</h1>
  {{ message_html }}
  {% if code %}
  <div class="code-box"><small>{{ form.code_label }}</small><strong>{{ code }}</strong></div>
  {% endif %}
  {% if form.success_redirect_url %}<a class="btn" href="{{ form.success_redirect_url }}" rel="noopener">Continue</a>{% endif %}
</div>
{% endblock %}

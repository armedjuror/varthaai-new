{% extends 'admin/base.html' %}
{% load static %}

{% block title %}Packs{% endblock %}

{% block content %}
<div class="page-body">

  <!-- Page header -->
  <div class="page-header">
    <div>
      <h1>Packs</h1>
      <p>Manage retail pack sizes, pricing and SKUs for this brand.</p>
    </div>
    <div class="page-header-actions">
      <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addPackModal" onclick="openAddPack()">
        <i class="fas fa-plus me-1"></i>Add Pack
      </button>
    </div>
  </div>

  <!-- Packs table -->
  <div class="data-card" style="padding:0">
    <div class="table-responsive">
      <table class="table">
        <thead>
          <tr>
            <th>Flavor</th>
            <th>Weight</th>
            <th>Label</th>
            <th>MRP</th>
            <th>Selling</th>
            <th>Cost</th>
            <th>SKU</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="packsTableBody">
          <tr><td colspan="9" class="text-center" style="padding:40px;color:var(--gray-400)">
            <div class="admin-loader-spinner" style="margin:0 auto 10px"></div>Loading…
          </td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div><!-- /.page-body -->

<!-- Add/Edit Pack Modal -->
<div class="modal fade" id="addPackModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="packModalTitle"><i class="fas fa-box me-2"></i>Add Pack</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="packForm">
        <input type="hidden" id="packId">
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Flavor *</label>
              <select class="form-select" id="packFlavorId" required>
                <option value="">Select a flavor…</option>
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label">Weight (g) *</label>
              <input type="number" class="form-control" id="packWeight" min="1" required>
            </div>
            <div class="col-md-3">
              <label class="form-label">Label *</label>
              <input type="text" class="form-control" id="packLabel" placeholder="e.g. 250g" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">MRP (₹)</label>
              <input type="number" class="form-control" id="packMrp" step="0.01" min="0">
            </div>
            <div class="col-md-4">
              <label class="form-label">Selling Price (₹)</label>
              <input type="number" class="form-control" id="packSelling" step="0.01" min="0">
            </div>
            <div class="col-md-4">
              <label class="form-label">Cost Price (₹)</label>
              <input type="number" class="form-control" id="packCost" step="0.01" min="0">
            </div>
            <div class="col-md-6">
              <label class="form-label">SKU</label>
              <input type="text" class="form-control" id="packSku">
            </div>
            <div class="col-md-6">
              <label class="form-label">Status</label>
              <div class="form-check mt-2">
                <input class="form-check-input" type="checkbox" id="packIsActive" checked>
                <label class="form-check-label" for="packIsActive">Active</label>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary btn-sm"><i class="fas fa-save me-1"></i>Save Pack</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}<script src="{% static 'js/admin/packs.js' %}"></script>{% endblock %}

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}My Day — Varthaai{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="{% static 'css/dash-style.css' %}">
  <link rel="stylesheet" href="{% static 'css/loader.css' %}">
  <style>
    body { background: var(--content-bg); font-family: 'Plus Jakarta Sans', sans-serif; padding-bottom: 32px; }
    .employee-topbar {
      background: var(--sidebar-bg); color: #fff; padding: 14px 18px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 10;
    }
    .employee-topbar .name { font-weight: 700; }
    .employee-topbar a { color: rgba(255,255,255,.75); }
    .employee-wrap { max-width: 560px; margin: 0 auto; padding: 16px; }
    .big-btn { width: 100%; padding: 18px; font-size: 1.1rem; font-weight: 700; border-radius: 14px; }
    .data-card { margin-bottom: 16px; }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>

<div class="admin-loader" id="adminLoader">
  <div class="admin-loader-inner">
    <div class="admin-loader-spinner"></div>
    <div class="admin-loader-label">Loading…</div>
  </div>
</div>

<header class="employee-topbar">
  <span class="name"><i class="fas fa-user me-2"></i>{{ request.user.name|default:request.user.username }}</span>
  <a href="{% url 'accounts:logout' %}" title="Logout"><i class="fas fa-arrow-right-from-bracket"></i></a>
</header>

<div class="employee-wrap">
  {% block content %}{% endblock %}
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'js/alert-modal.js' %}"></script>
<script src="{% static 'js/admin/utils.js' %}"></script>
<script src="{% static 'js/admin/csrf.js' %}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
